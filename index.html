<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شهادة تقدير</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Amiri', serif;
      background: #f9f2e4;
      margin: 0;
      padding: 0;
      border: 10px dotted #c1a875;
      box-sizing: border-box;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .input-section {
      background: #f2e0b9;
      border: 2px dotted #d4af37;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }

    .input-section h2 {
      font-size: 32px;
      background: linear-gradient(to right, #fcebb9, #e8c98b);
      padding: 10px 20px;
      display: inline-block;
      border-radius: 12px;
      border: 2px dashed #c0932b;
      margin-bottom: 20px;
      position: relative;
      color: #7c5a0c;
    }

    .input-section h2::before,
    .input-section h2::after {
      content: '🏅';
      font-size: 24px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .input-section h2::before {
      right: -35px;
    }

    .input-section h2::after {
      left: -35px;
    }

    .form-group {
      margin: 10px 0;
      text-align: right;
    }

    .form-group label {
      font-size: 18px;
      margin-right: 5px;
      display: block;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: inherit;
    }

    .btn-section {
      text-align: center;
      margin: 20px 0;
    }

    .btn {
      padding: 10px 25px;
      font-size: 18px;
      background: #d4af37;
      color: white;
      border: none;
      border-radius: 10px;
      margin: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .certificate {
      background-color: #fff8e1;
      border: 8px double #8b6f24;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .certificate .title {
      font-size: 36px;
      color: #8b6f24;
      margin-bottom: 20px;
      border: 3px solid #d4af37;
      padding: 10px 30px;
      border-radius: 12px;
      display: inline-block;
      background: #fff3c0;
      position: relative;
    }

    .certificate .title::before,
    .certificate .title::after {
      content: '🏅';
      font-size: 24px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .certificate .title::before {
      right: -30px;
    }

    .certificate .title::after {
      left: -30px;
    }

    .certificate .student-name {
      font-size: 30px;
      background: #f2d6a3;
      display: inline-block;
      padding: 10px 20px;
      margin: 10px 0;
      border-radius: 10px;
      color: #5b3d00;
    }

    .certificate .message {
      font-size: 22px;
      color: #444;
      margin: 15px 0;
      line-height: 1.8;
    }

    .certificate .footer {
      margin-top: 30px;
      font-size: 18px;
      color: #222;
    }

    .output {
      margin-top: 30px;
      text-align: center;
    }

    #actionButtons {
      display: none;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- إدخال البيانات -->
    <div class="input-section">
      <h2>بيانات الشهادة</h2>
      <div class="form-group">
        <label for="studentType">اختر النوع</label>
        <select id="studentType">
          <option value="الطالب">الطالب</option>
          <option value="الطالبة">الطالبة</option>
        </select>
      </div>
      <div class="form-group">
        <label for="studentName">اسم الطالب / الطالبة</label>
        <input type="text" id="studentName" placeholder="أدخل الاسم">
      </div>
      <div class="form-group">
        <label for="schoolName">اسم المدرسة</label>
        <input type="text" id="schoolName" placeholder="مدرستي الجميلة">
      </div>
      <div class="form-group">
        <label for="managerName">اسم المدير / المديرة</label>
        <input type="text" id="managerName" placeholder="المدير أحمد">
      </div>
    </div>

    <!-- الأزرار -->
    <div class="btn-section">
      <button class="btn" onclick="generateCertificate()">إنشاء الشهادة</button>
    </div>

    <!-- الشهادة -->
    <div class="output" id="certificateOutput"></div>

    <!-- أزرار العمليات -->
    <div id="actionButtons">
      <button class="btn" onclick="print()">طباعة</button>
      <button class="btn" onclick="downloadImage()">حفظ كصورة</button>
      <button class="btn" onclick="downloadPDF()">تحويل إلى PDF</button>
      <button class="btn" onclick="share()">مشاركة</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    function generateCertificate() {
      const studentType = document.getElementById('studentType').value;
      const name = document.getElementById('studentName').value.trim();
      const school = document.getElementById('schoolName').value.trim();
      const manager = document.getElementById('managerName').value.trim();

      if (!name || !school || !manager) {
        alert("يرجى ملء جميع الحقول.");
        return;
      }

      let appreciationMessage = studentType === 'الطالبة'
        ? `تعبيراً عن تقديرنا لتفوقها الدراسي وتميزها المستمر،
        وحرصها على المشاركة الفعالة والإبداع،
        وتمتعها بروح التعاون والاجتهاد في جميع الأنشطة.`
        : `تعبيراً عن تقديرنا لتفوقه الدراسي وتميزه المستمر،
        وحرصه على المشاركة الفعالة والإبداع،
        وتمتعه بروح التعاون والاجتهاد في جميع الأنشطة.`;

      const html = `
        <div class="certificate" id="certificate">
          <div class="title">شهادة تقدير</div>
          <div class="message">تُمنح هذه الشهادة إلى</div>
          <div class="student-name">${studentType} : ${name}</div>
          <div class="message">${appreciationMessage}</div>
          <div class="footer">
            مدير المدرسة: ${manager}<br>
            المدرسة: ${school}
          </div>
        </div>
      `;

      document.getElementById('certificateOutput').innerHTML = html;
      document.getElementById('actionButtons').style.display = 'block';
    }

    function print() {
      const printContent = document.getElementById('certificate').outerHTML;
      const win = window.open('', '', 'height=700,width=900');
      win.document.write('<html><head><title>طباعة الشهادة</title>');
      win.document.write('<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">');
      win.document.write('</head><body style="font-family:Amiri,serif;">');
      win.document.write(printContent);
      win.document.write('</body></html>');
      win.document.close();
      win.print();
    }

    function downloadImage() {
      html2canvas(document.getElementById('certificate')).then(canvas => {
        const link = document.createElement('a');
        link.download = 'شهادة_تقدير.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    async function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const canvas = await html2canvas(document.getElementById('certificate'));
      const imgData = canvas.toDataURL('image/png');
      const pdf = new jsPDF();
      const imgProps = pdf.getImageProperties(imgData);
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
      pdf.addImage(imgData, 'PNG', 0, 10, pdfWidth, pdfHeight);
      pdf.save('شهادة_تقدير.pdf');
    }

    function share() {
      if (navigator.share) {
        navigator.share({
          title: 'شهادة تقدير',
          text: 'احصل على شهادة تقدير مخصصة',
          url: window.location.href
        });
      } else {
        alert('المشاركة غير مدعومة في هذا المتصفح.');
      }
    }
  </script>
</body>
</html>
