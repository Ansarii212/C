<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شهادة تقدير</title>
  <style>
    body {
      background-color: #fdf5e6; /* بيج */
      font-family: 'Amiri', serif;
      text-align: center;
      padding: 20px;
    }

    .certificate {
      border: 5px double #bfa16b;
      padding: 40px;
      width: 800px;
      margin: auto;
      background-color: #fffaf0;
      box-shadow: 0 0 10px #aaa;
      color: #5c4438;
      direction: rtl;
    }

    h1 {
      font-size: 36px;
      color: #8b5e3c;
      text-shadow: 1px 1px 1px #d2b48c;
    }

    .decor {
      font-size: 20px;
      color: #a0522d;
    }

    .input-group {
      margin: 15px;
    }

    input {
      padding: 10px;
      font-size: 18px;
      width: 60%;
      margin-top: 10px;
      text-align: center;
    }

    .buttons {
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background-color: #d2b48c;
      border: none;
      border-radius: 5px;
      color: #fff;
    }

    #output {
      margin-top: 50px;
      page-break-after: always;
    }

    .name {
      font-size: 28px;
      color: #8b0000;
      font-weight: bold;
    }

    .signature {
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      padding: 0 50px;
      font-size: 18px;
    }

    @media print {
      .no-print {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="certificate no-print">
    <h1>إنشاء شهادة تقدير</h1>
    <div class="input-group">
      <label>اسم الطالب:</label><br>
      <input id="studentName" type="text" placeholder="أدخل اسم الطالب">
    </div>
    <div class="input-group">
      <label>اسم المدير:</label><br>
      <input id="managerName" type="text" placeholder="أدخل اسم المدير">
    </div>
    <div class="input-group">
      <label>اسم المدرسة:</label><br>
      <input id="schoolName" type="text" placeholder="أدخل اسم المدرسة">
    </div>
    <div class="buttons">
      <button onclick="generateCertificate()">إنشاء الشهادة</button>
      <button onclick="print()">طباعة</button>
      <button onclick="downloadAsImage()">حفظ كصورة</button>
      <button onclick="downloadAsPDF()">تحويل إلى PDF</button>
    </div>
  </div>

  <div id="output" class="certificate" style="display:none;">
    <h1>شهادة تقدير</h1>
    <p class="decor">تُمنح هذه الشهادة لـ</p>
    <p class="name" id="certStudentName"></p>
    <p class="decor">وذلك تقديراً لجهوده المبذولة وتفوقه الملحوظ خلال العام الدراسي</p>
    <p class="decor">مع أطيب الأمنيات بمزيد من النجاح والتقدم</p>

    <div class="signature">
      <div>المدير: <span id="certManagerName"></span></div>
      <div>المدرسة: <span id="certSchoolName"></span></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    function generateCertificate() {
      const student = document.getElementById("studentName").value;
      const manager = document.getElementById("managerName").value;
      const school = document.getElementById("schoolName").value;

      document.getElementById("certStudentName").textContent = student;
      document.getElementById("certManagerName").textContent = manager;
      document.getElementById("certSchoolName").textContent = school;

      document.getElementById("output").style.display = "block";
      window.scrollTo(0, document.body.scrollHeight);
    }

    function downloadAsImage() {
      const output = document.getElementById("output");
      html2canvas(output).then(canvas => {
        const link = document.createElement("a");
        link.download = "شهادة_تقدير.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    async function downloadAsPDF() {
      const { jsPDF } = window.jspdf;
      const output = document.getElementById("output");

      html2canvas(output).then(canvas => {
        const imgData = canvas.toDataURL("image/png");
        const pdf = new jsPDF('landscape', 'pt', [canvas.width, canvas.height]);
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save("شهادة_تقدير.pdf");
      });
    }
  </script>

</body>
</html>
