<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شهادة تقدير</title>
  <style>
    body {
      font-family: 'Amiri', serif;
      background-color: #f5f0e6;
      margin: 0;
      text-align: center;
      color: #333;
    }

    .container {
      width: 80%;
      margin: auto;
      padding: 20px;
      border: 6px double #bfa570;
      border-radius: 25px;
      background-color: #fff8f0;
    }

    .form-section input, .form-section select {
      width: 80%;
      padding: 10px;
      margin: 10px auto;
      display: block;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 10px;
      background-color: #fef9f4;
    }

    h1 {
      font-size: 36px;
      border: 2px dotted #bfa570;
      padding: 10px;
      background-color: #f9f2e8;
      display: inline-block;
      margin-top: 20px;
      position: relative;
    }

    .medal {
      width: 40px;
      position: absolute;
      top: -10px;
    }

    .left-medal {
      left: -50px;
    }

    .right-medal {
      right: -50px;
    }

    .button {
      background-color: #f5e2c8;
      border: 2px solid #bfa570;
      padding: 10px 20px;
      margin: 10px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      color: black;
    }

    .popup {
      display: none;
      position: relative;
      background-color: #fff;
      border: 3px dashed #bfa570;
      padding: 20px;
      border-radius: 20px;
      margin-top: 20px;
    }

    .timer {
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
    }

    .certificate {
      display: none;
      background-color: #fff8f0;
      padding: 20px;
      border-radius: 20px;
      border: 5px double #bfa570;
      margin-top: 20px;
    }

    .highlight {
      display: inline-block;
      background-color: #f3dfc2;
      padding: 5px 10px;
      border-radius: 10px;
    }

    .bottom-buttons {
      display: none;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    iframe {
      width: 300px;
      height: 170px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- نموذج الإدخال -->
  <div class="form-section">
    <h2>نموذج إدخال البيانات</h2>
    <select id="gender">
      <option value="male">الطالب</option>
      <option value="female">الطالبة</option>
    </select>
    <input type="text" id="studentName" placeholder="أدخل اسم الطالب/ة">
    <input type="text" id="grade" placeholder="الصف الدراسي">
    <input type="text" id="schoolName" placeholder="اسم المدرسة">
    <input type="text" id="directorName" placeholder="اسم المدير">
    <button class="button" onclick="showPopup()">إظهار الشهادة</button>
  </div>

  <!-- منبثق الاشتراك -->
  <div class="popup" id="subscribePopup">
    <h3>قبل مشاهدة الشهادة، يُرجى الاشتراك</h3>
    <iframe src="https://www.youtube.com/embed/JXLa6vLQhXE?autoplay=1" allow="autoplay"></iframe>
    <div class="timer" id="timer">01:00</div>
    <a class="button" href="https://youtube.com/channel/UCOyD7hrUD4FH02uSaHkVd6A" target="_blank">الاشتراك في القناة</a>
    <a class="button" href="https://x.com/forms_teachers" target="_blank">الاشتراك في X</a>
  </div>

  <!-- الشهادة -->
  <div class="certificate" id="certificate">
    <h1>
      <img src="https://i.imgur.com/HRg4PvF.png" class="medal left-medal">
      شهادة تقدير
      <img src="https://i.imgur.com/HRg4PvF.png" class="medal right-medal">
    </h1>
    <h2 id="studentDisplay"></h2>
    <p id="gradeDisplay"></p>
    <p id="thanksMessage"></p>
    <p><span class="highlight">اسم المدرسة:</span> <span id="schoolDisplay"></span></p>
    <p><span class="highlight">اسم المدير:</span> <span id="directorDisplay"></span></p>
  </div>

  <!-- الأزرار السفلية -->
  <div class="bottom-buttons" id="finalButtons">
    <button class="button" onclick="window.print()">طباعة</button>
    <button class="button" onclick="alert('يتم التحويل إلى PDF')">PDF</button>
    <button class="button" onclick="alert('مشاركة الرابط')">مشاركة</button>
  </div>

</div>

<script>
  let countdown;
  function showPopup() {
    document.getElementById('subscribePopup').style.display = 'block';
    let time = 60;
    updateTimer(time);
    countdown = setInterval(() => {
      time--;
      updateTimer(time);
      if (time <= 0) {
        clearInterval(countdown);
        document.getElementById('subscribePopup').style.display = 'none';
        showCertificate();
      }
    }, 1000);
  }

  function updateTimer(seconds) {
    const min = String(Math.floor(seconds / 60)).padStart(2, '0');
    const sec = String(seconds % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `${min}:${sec}`;
  }

  function showCertificate() {
    const name = document.getElementById('studentName').value;
    const grade = document.getElementById('grade').value;
    const school = document.getElementById('schoolName').value;
    const director = document.getElementById('directorName').value;
    const gender = document.getElementById('gender').value;

    const studentLabel = gender === 'male' ? 'الطالب :' : 'الطالبة :';
    document.getElementById('studentDisplay').innerHTML = `${studentLabel} <span class="highlight">${name}</span>`;
    document.getElementById('gradeDisplay').innerHTML = `الصف: <span class="highlight">${grade}</span>`;
    document.getElementById('schoolDisplay').textContent = school;
    document.getElementById('directorDisplay').textContent = director;

    const thanks = gender === 'male'
      ? "نُعبّر لك عن شكرنا وتقديرنا لما قدمته من تفوق وتميز.\nتُثمن جهودك الرائعة في هذا المسار.\nنفتخر بك دائماً."
      : "نُعبّر لكِ عن شكرنا وتقديرنا لما قدمتهِ من تفوق وتميز.\nتُثمن جهودكِ الرائعة في هذا المسار.\nنفتخر بكِ دائماً.";
    
    document.getElementById('thanksMessage').innerText = thanks;

    document.getElementById('certificate').style.display = 'block';
    document.getElementById('finalButtons').style.display = 'flex';
  }
</script>

</body>
</html>
