<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شهادة تقدير</title>
  <style>
    body {
      font-family: 'Amiri', serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      border: 2px dotted #c2a16c;
    }

    .header {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      color: #c2a16c;
      position: relative;
      padding: 20px;
    }

    .header::before,
    .header::after {
      content: '🎖️';
      font-size: 40px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .header::before {
      left: -50px;
    }

    .header::after {
      right: -50px;
    }

    .form-section {
      margin-top: 30px;
    }

    .form-section label {
      font-size: 18px;
      margin-bottom: 10px;
      display: block;
    }

    .form-section input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .form-section select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }

    .buttons button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      background-color: #c2a16c;
      color: #fff;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .buttons button:hover {
      background-color: #a28553;
    }

    .popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .popup-content {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: 400px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    .popup-content h3 {
      font-size: 20px;
      color: #333;
    }

    .popup-content button {
      background-color: #c2a16c;
      color: #fff;
      font-size: 18px;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }

    .popup-content button:hover {
      background-color: #a28553;
    }

    iframe {
      width: 100%;
      height: 200px;
      margin-top: 20px;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">شهادة تقدير</div>
    <div class="form-section">
      <label for="student-name">اسم الطالب:</label>
      <input type="text" id="student-name" placeholder="أدخل اسم الطالب">

      <label for="school-name">اسم المدرسة:</label>
      <input type="text" id="school-name" placeholder="أدخل اسم المدرسة">

      <label for="principal-name">اسم المدير:</label>
      <input type="text" id="principal-name" placeholder="أدخل اسم المدير">

      <label for="gender">النوع:</label>
      <select id="gender">
        <option value="male">الطالب</option>
        <option value="female">الطالبة</option>
      </select>
    </div>

    <div class="buttons">
      <button onclick="showPopup()">إظهار الشهادة</button>
      <button onclick="savePDF()">حفظ PDF</button>
      <button onclick="printCertificate()">طباعة</button>
    </div>
  </div>

  <div id="popup" class="popup">
    <div class="popup-content">
      <h3>يرجى الاشتراك أو مشاهدة الفيديو قبل المتابعة</h3>
      <iframe src="https://www.youtube.com/embed/JXLa6vLQhXE?autoplay=1" frameborder="0"></iframe>
      <div>
        <button onclick="subscribeYouTube()">اشترك في قناتي على يوتيوب</button>
        <button onclick="goToX()">تابعني على X</button>
        <button onclick="closePopup()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    let timer;
    function showPopup() {
      document.getElementById('popup').style.display = 'flex';
      disableButtons(true);

      timer = setTimeout(function() {
        enableButtons(true);
        closePopup();
      }, 60000); // 60 seconds timeout
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
    }

    function disableButtons(disable) {
      const buttons = document.querySelectorAll('.buttons button');
      buttons.forEach(button => {
        button.disabled = disable;
      });
    }

    function enableButtons(enable) {
      const buttons = document.querySelectorAll('.buttons button');
      buttons.forEach(button => {
        button.disabled = !enable;
      });
    }

    function subscribeYouTube() {
      window.open("https://youtube.com/channel/UCOyD7hrUD4FH02uSaHkVd6A", "_blank");
    }

    function goToX() {
      window.open("https://x.com/ansarii212", "_blank");
    }

    function savePDF() {
      alert("سيتم حفظ الشهادة كملف PDF قريبًا.");
    }

    function printCertificate() {
      window.print();
    }
  </script>

</body>
</html>
