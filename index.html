<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>شهادة تقدير</title>
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Scheherazade', serif;
      background: linear-gradient(to bottom, #f5e6d3, #f3e0c0);
      padding: 20px;
      text-align: center;
      color: #333;
    }
    .certificate {
      background-color: #fffaf0;
      border: 10px double #8b6f24;
      border-radius: 25px;
      padding: 40px;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    .title-box {
      border: 4px solid #d4af37;
      padding: 10px 30px;
      display: inline-block;
      font-size: 30px;
      font-weight: bold;
      background: linear-gradient(to right, #fff2c2, #fbe7a1);
      color: #8b6f24;
      margin-bottom: 25px;
      border-radius: 12px;
      position: relative;
    }
    .title-box::before,
    .title-box::after {
      content: '🏅';
      font-size: 24px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }
    .title-box::before { right: 100%; margin-right: 10px; }
    .title-box::after { left: 100%; margin-left: 10px; }

    input {
      padding: 8px;
      margin: 10px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 18px;
      font-family: inherit;
    }

    .btn {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      background-color: #d4af37;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .output {
      margin-top: 30px;
      font-size: 20px;
    }

    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      text-align: center;
    }

    iframe {
      width: 100%;
      height: 300px;
      margin-bottom: 15px;
    }

    .subscribe-links a {
      display: inline-block;
      margin: 10px;
      color: #0066cc;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2>شكرًا لزيارتك!</h2>
    <p>يرجى مشاهدة هذا الفيديو، سيتم تفعيل الإجراء بعد 60 ثانية.</p>
    <iframe src="https://www.youtube.com/embed/JXLa6vLQhXE?rel=0&autoplay=1"
            frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <div class="subscribe-links">
      <a href="https://youtube.com/channel/UCOyD7hrUD4FH02uSaHkVd6A" target="_blank">اشترك في قناتي</a>
      <a href="https://x.com/ansarii212" target="_blank">تابعني على X</a>
    </div>
    <p id="timer">الرجاء الانتظار 60 ثانية...</p>
  </div>
</div>

<!-- Certificate content -->
<div class="certificate">
  <div class="title-box">شهادة تقدير</div>
  <br />
  <input type="text" id="studentName" placeholder="اسم الطالب / الطالبة" />
  <input type="text" id="schoolName" placeholder="اسم المدرسة" />
  <input type="text" id="managerName" placeholder="اسم المدير / المديرة" />
  <br />
  <button class="btn" onclick="startAction('generate')">إنشاء الشهادة</button>
  <button class="btn" onclick="startAction('print')">طباعة</button>
  <button class="btn" onclick="startAction('download')">حفظ كصورة</button>
</div>

<div class="output" id="certificateOutput"></div>

<!-- html2canvas -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
  let pendingAction = '';

  function startAction(action) {
    pendingAction = action;
    document.getElementById('modal').style.display = 'flex';
    let counter = 60;
    const timer = document.getElementById('timer');
    timer.textContent = `الرجاء الانتظار ${counter} ثانية...`;
    const countdown = setInterval(() => {
      counter--;
      timer.textContent = `الرجاء الانتظار ${counter} ثانية...`;
      if (counter <= 0) {
        clearInterval(countdown);
        document.getElementById('modal').style.display = 'none';
        handleAction(pendingAction);
      }
    }, 1000);
  }

  function handleAction(action) {
    if (action === 'generate') {
      generateCertificate();
    } else if (action === 'print') {
      window.print();
    } else if (action === 'download') {
      downloadAsImage();
    }
  }

  function generateCertificate() {
    const student = document.getElementById("studentName").value.trim();
    const school = document.getElementById("schoolName").value.trim();
    const manager = document.getElementById("managerName").value.trim();
    if (!student || !school || !manager) {
      alert("يرجى ملء جميع الحقول.");
      return;
    }

    const message = `
      <div class="certificate" style="background: linear-gradient(to bottom, #f5e6d3, #f3e0c0); border: 10px double #8b6f24; border-radius: 25px; padding: 40px;">
        <div class="title-box">شهادة تقدير</div>
        <p style="font-size: 20px;">تُمنح هذه الشهادة لـ</p>
        <h2 style="font-size: 30px; margin: 10px 0;">${student}</h2>
        <p style="font-size: 20px;">
          تقديراً لتفوقه وجهوده المميزة خلال الفترة الدراسية
        </p>
        <br />
        <p style="font-size: 18px;">مدير المدرسة: ${manager}</p>
        <p style="font-size: 18px;">المدرسة: ${school}</p>
      </div>
    `;
    document.getElementById("certificateOutput").innerHTML = message;
  }

  function downloadAsImage() {
    html2canvas(document.querySelector("#certificateOutput")).then(canvas => {
      const link = document.createElement("a");
      link.download = "certificate.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  }
</script>
</body>
</html>
