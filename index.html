<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شهادة شكر وتقدير</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #2f5f63;
      font-family: 'Cairo', sans-serif;
    }
    .container {
      width: 1000px;
      max-width: 95%;
      margin: 50px auto;
      background-color: #fdf2dc;
      padding: 40px;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      text-align: center;
      border-radius: 10px;
    }
    .side-decor {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
    }
    .side-decor img {
      height: 100%;
    }
    h1 {
      font-size: 36px;
      color: #2f5f63;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 20px;
      margin-bottom: 30px;
    }
    .student-name {
      font-size: 32px;
      font-weight: bold;
      background-color: #d4b98c;
      display: inline-block;
      padding: 5px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .school-name {
      font-size: 18px;
      margin-top: 20px;
      color: #333;
    }
    .description {
      font-size: 16px;
      color: #444;
      margin: 20px auto;
      width: 80%;
    }
    .footer {
      font-size: 22px;
      margin-top: 40px;
      color: #2f5f63;
    }
    .signatures {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
      padding: 0 60px;
      font-size: 14px;
      color: #444;
    }
    .signature {
      text-align: center;
    }
    .input-area {
      text-align: center;
      margin-bottom: 30px;
    }
    input {
      font-size: 18px;
      padding: 10px;
      margin: 5px;
      width: 250px;
      text-align: center;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2f5f63;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
  </style>
</head>
<body>
  <div class="input-area">
    <input type="text" id="studentInput" placeholder="ادخل اسم الطالب">
    <input type="text" id="schoolInput" placeholder="ادخل اسم المدرسة">
    <br>
    <button onclick="generate()">إنشاء الشهادة</button>
    <button onclick="downloadImage()">تحميل كصورة</button>
    <button onclick="downloadPDF()">تحميل PDF</button>
    <button onclick="window.print()">طباعة</button>
  </div>

  <div class="container" id="certificate" style="display:none;">
    <div class="side-decor">
      <img src="https://images.app.goo.gl/JFqwFwSH36DgxnNR6.png" alt="زخرفة">
    </div>
    <h1>شكر وتقدير</h1>
    <div class="subtitle">تُقدم هذه الشهادة بفخر إلى</div>
    <div class="student-name" id="studentName">اسم الطالب</div>
    <div class="description">
      هو ببساطة نص شكلي يُستخدم في صناعة المطابع ودور النشر. كان لوريم إيبسوم ولا يزال المعيار للنص الشكلي.
    </div>
    <div class="footer">مع تمنياتنا له بدوام النجاح</div>
    <div class="signatures">
      <div class="signature">
        <div>اسم المسؤول وإحالته</div>
      </div>
      <div class="signature">
        <div>شكر وتقدير</div>
      </div>
      <div class="signature">
        <div>اسم المسؤول وإحالته</div>
      </div>
    </div>
    <div class="school-name" id="schoolName">اسم المدرسة</div>
  </div>

  <script>
    function generate() {
      const student = document.getElementById("studentInput").value.trim();
      const school = document.getElementById("schoolInput").value.trim();
      if (!student || !school) {
        alert("من فضلك أدخل اسم الطالب واسم المدرسة");
        return;
      }
      document.getElementById("studentName").textContent = student;
      document.getElementById("schoolName").textContent = school;
      document.getElementById("certificate").style.display = "block";
      document.getElementById("certificate").scrollIntoView({ behavior: "smooth" });
    }

    function downloadImage() {
      html2canvas(document.getElementById("certificate")).then(canvas => {
        const link = document.createElement("a");
        link.download = "شهادة-تقدير.png";
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    async function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const canvas = await html2canvas(document.getElementById("certificate"));
      const imgData = canvas.toDataURL("image/png");
      const pdf = new jsPDF("landscape", "px", [canvas.width, canvas.height]);
      pdf.addImage(imgData, "PNG", 0, 0, canvas.width, canvas.height);
      pdf.save("شهادة-تقدير.pdf");
    }
  </script>
</body>
</html>
