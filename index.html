<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شهادة تقدير</title>

  <!-- خط مزخرف -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to bottom right, #fef6e4, #f3e9dc);
      font-family: 'Amiri', serif;
      text-align: center;
      padding: 20px;
    }

    .certificate {
      border: 5px solid #bfa16b;
      border-radius: 30px;
      padding: 40px;
      width: 800px;
      margin: auto;
      background-color: #fffaf0;
      box-shadow: 0 0 15px #d2b48c;
      color: #5c4438;
      direction: rtl;
    }

    .title-box {
      border: 3px dashed #bfa16b;
      border-radius: 20px;
      display: inline-block;
      padding: 15px 30px;
      background-color: #fef6e4;
      margin-bottom: 30px;
      box-shadow: 0 0 5px #ccc inset;
    }

    .title-box h1 {
      font-size: 36px;
      color: #8b5e3c;
      margin: 0;
      display: inline-block;
    }

    .medal {
      font-size: 36px;
      color: #d4af37;
      margin: 0 10px;
      vertical-align: middle;
    }

    .decor {
      font-size: 22px;
      color: #8b5e3c;
      font-style: italic;
    }

    .input-group {
      margin: 15px;
    }

    input, select {
      padding: 10px;
      font-size: 18px;
      width: 60%;
      margin-top: 10px;
      text-align: center;
    }

    .buttons {
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background-color: #d2b48c;
      border: none;
      border-radius: 5px;
      color: #fff;
    }

    #output {
      margin-top: 50px;
      page-break-after: always;
    }

    .name {
      font-size: 30px;
      color: #6b240c;
      font-weight: bold;
      background: linear-gradient(to right, #fdf3e7, #f5e5cd);
      padding: 10px 20px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 0 5px #ccc;
    }

    .signature {
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      padding: 0 50px;
      font-size: 18px;
    }

    @media print {
      .no-print {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="certificate no-print">
    <div class="title-box">
      <span class="medal">🏅</span>
      <h1>شهادة تقدير</h1>
      <span class="medal">🏅</span>
    </div>

    <div class="input-group">
      <label>اختر النوع:</label><br>
      <select id="studentType">
        <option value="الطالب">الطالب</option>
        <option value="الطالبة">الطالبة</option>
      </select>
    </div>

    <div class="input-group">
      <label>اسم الطالب/الطالبة:</label><br>
      <input id="studentName" type="text" placeholder="أدخل الاسم">
    </div>

    <div class="input-group">
      <label>اسم المدير:</label><br>
      <input id="managerName" type="text" placeholder="أدخل اسم المدير">
    </div>

    <div class="input-group">
      <label>اسم المدرسة:</label><br>
      <input id="schoolName" type="text" placeholder="أدخل اسم المدرسة">
    </div>

    <div class="buttons">
      <button onclick="generateCertificate()">إنشاء الشهادة</button>
      <button onclick="print()">طباعة</button>
      <button onclick="downloadAsImage()">حفظ كصورة</button>
      <button onclick="downloadAsPDF()">تحويل إلى PDF</button>
    </div>
  </div>

  <div id="output" class="certificate" style="display:none;">
    <div class="title-box">
      <span class="medal">🏅</span>
      <h1>شهادة تقدير</h1>
      <span class="medal">🏅</span>
    </div>

    <p class="decor">تُمنح هذه الشهادة لـ</p>
    <p class="name" id="certStudentFullName"></p>
    <p class="decor">وذلك تقديراً لجهوده المبذولة وتفوقه الملحوظ خلال العام الدراسي</p>
    <p class="decor">مع أطيب الأمنيات بمزيد من النجاح والتقدم</p>

    <div class="signature">
      <div>المدير: <span id="certManagerName"></span></div>
      <div>المدرسة: <span id="certSchoolName"></span></div>
    </div>
  </div>

  <!-- مكتبتا الحفظ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    function generateCertificate() {
      const type = document.getElementById("studentType").value;
      const name = document.getElementById("studentName").value;
      const manager = document.getElementById("managerName").value;
      const school = document.getElementById("schoolName").value;

      document.getElementById("certStudentFullName").textContent = `${type} ${name}`;
      document.getElementById("certManagerName").textContent = manager;
      document.getElementById("certSchoolName").textContent = school;

      document.getElementById("output").style.display = "block";
      window.scrollTo(0, document.body.scrollHeight);
    }

    function downloadAsImage() {
      const output = document.getElementById("output");
      html2canvas(output, { scale: 2 }).then(canvas => {
        const link = document.createElement("a");
        link.download = "شهادة_تقدير.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    async function downloadAsPDF() {
      const { jsPDF } = window.jspdf;
      const output = document.getElementById("output");

      html2canvas(output, { scale: 2 }).then(canvas => {
        const imgData = canvas.toDataURL("image/png");
        const pdf = new jsPDF('landscape', 'pt', [canvas.width, canvas.height]);
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save("شهادة_تقدير.pdf");
      });
    }
  </script>

</body>
</html>
