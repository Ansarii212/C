<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>شهادة تقدير</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- نموذج إدخال البيانات -->
    <div class="form-section">
      <h2>بيانات الشهادة</h2>
      <label>النوع:</label>
      <select id="gender">
        <option value="طالب">الطالب</option>
        <option value="طالبة">الطالبة</option>
      </select>
      <input type="text" id="studentName" placeholder="ادخل الاسم هنا">
      <input type="text" id="studentClass" placeholder="ادخل الصف">
      <input type="text" id="schoolName" placeholder="ادخل اسم المدرسة">
      <input type="text" id="directorName" placeholder="ادخل اسم المدير">
      <button onclick="showPopup()">عرض الشهادة</button>
    </div>

    <!-- المنبثق -->
    <div class="popup" id="popup">
      <h3>جاري إصدار الشهادة</h3>
      <div id="countdown">01:00</div>
      <p>يرجى الاشتراك:</p>
      <a class="social-btn" href="https://youtube.com/channel/UCOyD7hrUD4FH02uSaHkVd6A" target="_blank">الاشتراك في القناة</a>
      <a class="social-btn" href="https://x.com/forms_teachers" target="_blank">الاشتراك في X</a>
    </div>

    <!-- الشهادة -->
    <div class="certificate" id="certificate" style="display:none;">
      <div class="title-box">
        <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" class="medal" />
        <h1>شهادة تقدير</h1>
        <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" class="medal" />
      </div>
      <h2 id="studentLine"></h2>
      <h3 id="classLine"></h3>
      <p class="thanks">
        لما قدمه من تفوق وجهد متواصل <br>
        ومثابرته في دراسته وأخلاقه العالية <br>
        وحرصه على النجاح والتميز
      </p>
      <div class="footer">
        <div class="school"><strong>اسم المدرسة:</strong> <span id="schoolText"></span></div>
        <div class="director"><strong>اسم المدير:</strong> <span id="directorText"></span></div>
      </div>
    </div>

    <!-- أزرار الحفظ -->
    <div class="actions" id="finalButtons" style="display:none;">
      <button onclick="downloadImage()">حفظ الصورة</button>
      <button onclick="downloadPDF()">تحويل إلى PDF</button>
      <button onclick="printCert()">طباعة</button>
      <button onclick="shareCert()">مشاركة</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
