<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شهادة تقدير</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f5f0e6;
      font-family: 'Amiri', serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .certificate-container {
      width: 800px;
      margin: 50px auto;
      padding: 40px;
      background-color: #fffaf0;
      border: 10px double #8b6e4b;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }

    .certificate-title {
      font-size: 36px;
      color: #7b4f2f;
      border: 2px dotted #d9b382;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 15px;
      position: relative;
    }

    .certificate-title::before,
    .certificate-title::after {
      content: "🏅";
      font-size: 24px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .certificate-title::before {
      right: 100%;
      margin-right: 10px;
    }

    .certificate-title::after {
      left: 100%;
      margin-left: 10px;
    }

    .recipient-name {
      margin-top: 20px;
      font-size: 28px;
      background-color: #f3e3c3;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
    }

    .certificate-body {
      margin-top: 30px;
      font-size: 20px;
      color: #5a3e1b;
      line-height: 1.6;
      font-weight: bold;
    }

    .footer {
      margin-top: 40px;
      display: flex;
      justify-content: space-around;
    }

    .footer div {
      background-color: #f3e3c3;
      padding: 10px 20px;
      border-radius: 10px;
      width: 200px;
      text-align: center;
      font-size: 18px;
    }

    .buttons {
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      background-color: #f3e3c3;
      border: 2px solid #bba47f;
      border-radius: 15px;
      cursor: pointer;
      font-family: 'Amiri', serif;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #e5d2b6;
    }
  </style>
</head>
<body>

  <div class="certificate-container" id="certificate">
    <div class="certificate-title">شهادة تقدير</div>
    <div class="recipient-name">الطالبة: فاطمة الزهراء</div>
    <div class="certificate-body">
      نشكر جهودكِ وتفوقكِ ونبارك لكِ هذا الإنجاز الرائع.<br>
      دمتِ نموذجًا للتميز والإبداع والطموح.<br>
      ونتمنى لكِ مزيدًا من النجاح في المستقبل.
    </div>
    <div class="footer">
      <div>اسم المدرسة: مدرسة النور</div>
      <div>اسم المدير: أحمد عبدالعزيز</div>
    </div>
  </div>

  <div class="buttons">
    <button onclick="downloadCertificate()">حفظ الشهادة كصورة</button>
    <button onclick="window.print()">طباعة</button>
    <button onclick="shareCertificate()">مشاركة</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    function downloadCertificate() {
      const element = document.getElementById("certificate");
      html2canvas(element).then(canvas => {
        const link = document.createElement("a");
        link.download = "شهادة_تقدير.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    function shareCertificate() {
      alert("انسخ رابط الصفحة لمشاركة الشهادة، أو احفظها كصورة وشاركها.");
    }
  </script>

</body>
</html>
