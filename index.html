
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>شهادة تقدير</title>
  <style>
    body {
      font-family: 'Amiri', serif;
      background: linear-gradient(to bottom, #f5e6d3, #f3e0c0);
      padding: 20px;
      text-align: center;
      color: #333;
    }
    .certificate {
      background-color: #fff8ed;
      border: 6px double #a88e5c;
      border-radius: 20px;
      padding: 40px;
      max-width: 800px;
      margin: auto;
      position: relative;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    .title-box {
      border: 3px solid #d4af37;
      padding: 10px 20px;
      display: inline-block;
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(to right, #fff5cc, #f9e79f);
      color: #8b6f24;
      margin-bottom: 20px;
      border-radius: 10px;
      position: relative;
    }
    .title-box::before,
    .title-box::after {
      content: '🏅';
      font-size: 24px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }
    .title-box::before {
      right: 100%;
      margin-right: 10px;
    }
    .title-box::after {
      left: 100%;
      margin-left: 10px;
    }
    input {
      padding: 8px;
      margin: 10px;
      border: 1px solid #aaa;
      border-radius: 6px;
    }
    .btn {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      background-color: #d4af37;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .output {
      margin-top: 30px;
      font-size: 18px;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      text-align: center;
    }
    iframe {
      width: 100%;
      height: 300px;
      margin-bottom: 15px;
    }
    .subscribe-links a {
      display: inline-block;
      margin: 10px;
      color: #0066cc;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2>شكرًا لزيارتك!</h2>
    <p>يرجى مشاهدة هذا الفيديو، سيتم تفعيل الأزرار خلال 60 ثانية.</p>
    <iframe src="https://www.youtube.com/embed/JXLa6vLQhXE?rel=0&autoplay=1"
            frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <div class="subscribe-links">
      <a href="https://youtube.com/channel/UCOyD7hrUD4FH02uSaHkVd6A" target="_blank">اشترك في قناتي</a>
      <a href="https://x.com/ansarii212" target="_blank">تابعني على X</a>
    </div>
    <p id="timer">الرجاء الانتظار 60 ثانية...</p>
  </div>
</div>

<div class="certificate">
  <div class="title-box">شهادة تقدير</div>
  <br />
  <input type="text" id="studentName" placeholder="اسم الطالب / الطالبة" />
  <input type="text" id="schoolName" placeholder="اسم المدرسة" />
  <input type="text" id="managerName" placeholder="اسم المدير / المديرة" />
  <br />
  <button class="btn" id="generateBtn" disabled onclick="generateCertificate()">إنشاء الشهادة</button>
  <button class="btn" id="printBtn" disabled onclick="window.print()">طباعة</button>
  <button class="btn" id="downloadBtn" disabled onclick="downloadAsImage()">حفظ كصورة</button>
</div>

<div class="output" id="certificateOutput"></div>

<script>
  // Countdown timer
  let counter = 60;
  const timer = document.getElementById('timer');
  const modal = document.getElementById('modal');
  const buttons = document.querySelectorAll('.btn');

  const countdown = setInterval(() => {
    counter--;
    timer.textContent = `الرجاء الانتظار ${counter} ثانية...`;
    if (counter <= 0) {
      clearInterval(countdown);
      modal.style.display = 'none';
      buttons.forEach(btn => btn.disabled = false);
    }
  }, 1000);

  function generateCertificate() {
    const student = document.getElementById("studentName").value.trim();
    const school = document.getElementById("schoolName").value.trim();
    const manager = document.getElementById("managerName").value.trim();
    if (!student || !school || !manager) {
      alert("يرجى ملء جميع الحقول.");
      return;
    }

    const message = `
      <div class="certificate" style="background: linear-gradient(to bottom, #f5e6d3, #f3e0c0);">
        <div class="title-box">شهادة تقدير</div>
        <p style="font-size: 20px;">تُمنح هذه الشهادة لـ</p>
        <h2 style="font-size: 30px; margin: 10px 0;">${student}</h2>
        <p style="font-size: 20px;">
          تقديراً لتفوقه وجهوده المميزة خلال الفترة الدراسية
        </p>
        <br />
        <p style="font-size: 18px;">مدير المدرسة: ${manager}</p>
        <p style="font-size: 18px;">المدرسة: ${school}</p>
      </div>
    `;
    document.getElementById("certificateOutput").innerHTML = message;
  }

  function downloadAsImage() {
    html2canvas(document.querySelector("#certificateOutput")).then(canvas => {
      const link = document.createElement("a");
      link.download = "certificate.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  }
</script>

<!-- html2canvas library -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</body>
</html>
