<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>شهادة تقدير</title>
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Scheherazade New', serif;
      background-color: #f3e6d0;
      margin: 0;
      padding: 0;
      direction: rtl;
      text-align: center;
    }

    .certificate {
      display: none;
      margin: 40px auto;
      padding: 40px;
      background: linear-gradient(to bottom, #fff8ec, #f1e4cc);
      border: 4px double #b4883b;
      border-radius: 20px;
      width: 70%;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .certificate h1 {
      font-size: 48px;
      color: #a36b2c;
      margin-bottom: 10px;
      position: relative;
    }

    .certificate h1::before,
    .certificate h1::after {
      content: '۞';
      font-size: 32px;
      color: #a36b2c;
      margin: 0 15px;
    }

    .student-name {
      font-size: 30px;
      background-color: #f0dfc2;
      padding: 10px 20px;
      border-radius: 10px;
      display: inline-block;
      margin: 10px auto 20px;
      font-weight: bold;
      color: #5a3d1c;
    }

    .cert-body {
      font-size: 22px;
      line-height: 2;
      color: #333;
      font-weight: bold;
    }

    .cert-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      font-size: 18px;
      font-weight: bold;
      color: #5c4228;
      padding: 0 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .buttons button {
      background-color: #c2a16c;
      color: white;
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Scheherazade New', serif;
    }
  </style>
</head>
<body>

  <div class="certificate" id="certificate">
    <h1>شهادة تقدير</h1>
    <div class="student-name" id="cert-name">الطالب: أحمد محمد</div>

    <div class="cert-body" id="cert-body">
      <p>تُمنح هذه الشهادة تقديراً لما قدمه من جهد وعطاء.</p>
      <p>نثني على تفوقه والتزامه، ونتمنى له مزيداً من النجاح.</p>
      <p>ونسأل الله له التوفيق والسداد في مسيرته التعليمية.</p>
    </div>

    <div class="cert-footer">
      <span id="school-label">اسم المدرسة: مدرسة النور</span>
      <span id="principal-label">اسم المدير: أ. خالد عبدالعزيز</span>
    </div>

    <div class="buttons">
      <button onclick="window.print()">طباعة</button>
      <button onclick="alert('سيتم حفظ PDF')">PDF</button>
      <button onclick="navigator.share ? navigator.share({ title: 'شهادة تقدير', text: 'شاهد شهادتي!', url: window.location.href }) : alert('جهازك لا يدعم المشاركة')">مشاركة</button>
    </div>
  </div>

  <script>
    // هذه دالة مثال لعرض الشهادة، يمكن ربطها بمنبثق أو زر
    function showCertificate() {
      const name = 'أحمد محمد'; // استبدله بمدخل المستخدم
      const gender = 'male'; // أو female حسب الاختيار

      const label = gender === 'female' ? 'الطالبة:' : 'الطالب:';
      const praise = gender === 'female'
        ? 'نثني على تفوقها والتزامها، ونتمنى لها مزيداً من النجاح.'
        : 'نثني على تفوقه والتزامه، ونتمنى له مزيداً من النجاح.';

      document.getElementById('cert-name').textContent = `${label} ${name}`;
      document.getElementById('cert-body').innerHTML = `
        <p>تُمنح هذه الشهادة تقديراً لما قدم${gender === 'female' ? 'ته' : 'ه'} من جهد وعطاء.</p>
        <p>${praise}</p>
        <p>ونسأل الله له${gender === 'female' ? 'ا' : ''} التوفيق والسداد في مسيرت${gender === 'female' ? 'ها' : 'ه'} التعليمية.</p>
      `;
      document.getElementById('certificate').style.display = 'block';
    }

    // عرض الشهادة تلقائياً للتجربة
    showCertificate();
  </script>

</body>
</html>
