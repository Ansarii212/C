<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>شهادة تقدير</title>
  <style>
    body {
      font-family: 'Amiri', serif;
      background-color: #f3e6d0;
      margin: 0;
      padding: 0;
      direction: rtl;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 30px;
      background-color: #fff;
      border: 3px dotted #c2a16c;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .header {
      font-size: 40px;
      font-weight: bold;
      color: #c2a16c;
      margin-bottom: 30px;
      position: relative;
    }

    .header::before,
    .header::after {
      content: '🏅';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 40px;
    }

    .header::before {
      right: -50px;
    }

    .header::after {
      left: -50px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-size: 18px;
    }

    input, select {
      width: 90%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
      margin-top: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .buttons button {
      background-color: #c2a16c;
      color: white;
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .popup {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .popup-content {
      background: white;
      padding: 20px;
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    .popup h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .popup iframe {
      width: 100%;
      height: 200px;
      border: none;
      border-radius: 10px;
    }

    .popup .timer {
      font-size: 24px;
      font-weight: bold;
      margin-top: 15px;
      color: #c55;
    }

    .popup .popup-links {
      margin-top: 20px;
    }

    .popup .popup-links button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #c2a16c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .popup .popup-links button:hover {
      background-color: #a28553;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">شهادة تقدير</div>

    <label for="gender">النوع</label>
    <select id="gender">
      <option value="male">الطالب</option>
      <option value="female">الطالبة</option>
    </select>

    <label for="student-name">اسم الطالب</label>
    <input type="text" id="student-name" placeholder="مثال: أحمد محمد">

    <label for="school-name">اسم المدرسة</label>
    <input type="text" id="school-name" placeholder="مثال: مدرسة النور">

    <label for="principal-name">اسم المدير</label>
    <input type="text" id="principal-name" placeholder="مثال: أ. خالد عبدالعزيز">

    <div class="buttons">
      <button onclick="triggerPopup()">إظهار الشهادة</button>
      <button onclick="triggerPopup()">حفظ PDF</button>
      <button onclick="triggerPopup()">طباعة</button>
      <button onclick="triggerPopup()">مشاركة</button>
    </div>
  </div>

  <div class="popup" id="popup">
    <div class="popup-content">
      <h3>يرجى مشاهدة الفيديو والاشتراك أولاً</h3>
      <iframe id="video" src="https://www.youtube.com/embed/JXLa6vLQhXE?autoplay=1&mute=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <div class="timer" id="timer">01:00</div>
      <div class="popup-links">
        <button onclick="window.open('https://youtube.com/channel/UCOyD7hrUD4FH02uSaHkVd6A', '_blank')">اشترك في القناة</button>
        <button onclick="window.open('https://x.com/ansarii212', '_blank')">تابعني على X</button>
      </div>
    </div>
  </div>

  <script>
    let countdown;
    function triggerPopup() {
      document.getElementById('popup').style.display = 'flex';
      let timeLeft = 60;
      updateTimerDisplay(timeLeft);
      countdown = setInterval(() => {
        timeLeft--;
        updateTimerDisplay(timeLeft);
        if (timeLeft <= 0) {
          clearInterval(countdown);
          document.getElementById('popup').style.display = 'none';
        }
      }, 1000);
    }

    function updateTimerDisplay(seconds) {
      const timerElement = document.getElementById("timer");
      const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      timerElement.textContent = `${mins}:${secs}`;
    }
  </script>

</body>
</html>
