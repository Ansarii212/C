<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شهادة تقدير</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      background: linear-gradient(to bottom right, #f8e9c0, #fff8dc);
      font-family: 'Amiri', serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #7a4f01;
      margin-bottom: 30px;
      text-shadow: 1px 1px #fff;
    }

    .input-area {
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 18px;
      border: 2px solid #7a4f01;
      border-radius: 5px;
      width: 300px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px 5px;
      background-color: #7a4f01;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #9b6a12;
    }

    .certificate {
      width: 800px;
      max-width: 100%;
      margin: 30px auto;
      padding: 50px;
      background: url('https://i.imgur.com/O1s6QmA.png') center center no-repeat;
      background-size: cover;
      border: 10px solid #d4af37;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      color: #3a2602;
      display: none;
      position: relative;
    }

    .certificate h2 {
      font-size: 36px;
      color: #7a4f01;
      margin-bottom: 20px;
      border-bottom: 2px dashed #d4af37;
      display: inline-block;
      padding-bottom: 5px;
    }

    .student-name {
      font-size: 30px;
      font-weight: bold;
      margin: 20px 0;
      color: #005f4b;
    }

    .certificate p {
      font-size: 20px;
      margin: 10px 0;
    }

    .decor-top {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
    }

    .decor-bottom {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%) rotate(180deg);
      width: 120px;
    }
  </style>
</head>
<body>

  <h1>مولد شهادة تقدير</h1>

  <div class="input-area">
    <input type="text" id="studentNameInput" placeholder="أدخل اسم الطالب هنا">
    <br>
    <button onclick="generateCertificate()">اصنع الشهادة</button>
    <button onclick="downloadCertificate()" id="saveBtn" style="display:none;">حفظ الشهادة</button>
    <button onclick="printCertificate()" id="printBtn" style="display:none;">طباعة الشهادة</button>
  </div>

  <div class="certificate" id="certificate">
    <img src="https://i.imgur.com/vT2KfRL.png" class="decor-top" alt="زخرفة">
    <h2>شهادة تقدير</h2>
    <p>تُمنح هذه الشهادة بكل فخر إلى:</p>
    <div class="student-name" id="studentName">اسم الطالب</div>
    <p>وذلك تقديرًا لتميزه وتفوقه الملحوظ وجهوده الرائعة خلال العام الدراسي.</p>
    <p>نتمنى له دوام النجاح والتقدم بإذن الله.</p>
    <p>مع خالص الشكر والتقدير، إدارة المدرسة</p>
    <img src="https://i.imgur.com/vT2KfRL.png" class="decor-bottom" alt="زخرفة">
  </div>

  <script>
    function generateCertificate() {
      const name = document.getElementById("studentNameInput").value.trim();
      const cert = document.getElementById("certificate");
      const studentName = document.getElementById("studentName");
      const saveBtn = document.getElementById("saveBtn");
      const printBtn = document.getElementById("printBtn");

      if (name.length === 0) {
        alert("من فضلك أدخل اسم الطالب");
        return;
      }

      studentName.textContent = name;
      cert.style.display = "block";
      saveBtn.style.display = "inline-block";
      printBtn.style.display = "inline-block";
      cert.scrollIntoView({ behavior: "smooth" });
    }

    function downloadCertificate() {
      const cert = document.getElementById("certificate");
      html2canvas(cert).then(canvas => {
        const link = document.createElement('a');
        link.download = 'شهادة_تقدير.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    function printCertificate() {
      const originalContent = document.body.innerHTML;
      const certificateContent = document.getElementById("certificate").outerHTML;
      document.body.innerHTML = certificateContent;
      window.print();
      document.body.innerHTML = originalContent;
      location.reload();
    }
  </script>

</body>
</html>
